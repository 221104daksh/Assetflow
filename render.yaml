services:
  - type: web
    name: assetflow
    env: python

    buildCommand: |
      pip install -r requirements.txt

    startCommand: |
      gunicorn "app:create_app()"

    envVars:
      - key: SECRET_KEY
        generateValue: true

      - key: DATABASE_URL
        fromDatabase:
          name: assetflow-db
          property: connectionString