{% extends "base.html" %}
{% block title %}Access Denied{% endblock %}
{% block content %}
<div class="af-empty">
  <i class="bi bi-shield-lock"></i>
  <h3 class="fw-bold">Access Denied</h3>
  <p>You don't have permission to view this page. This area is restricted to administrators.</p>
  <a href="{{ url_for('dashboard.index') }}" class="btn btn-af-primary">Back to Dashboard</a>
</div>
{% endblock %}
{% block guest_content %}
<div class="af-empty">
  <i class="bi bi-shield-lock"></i>
  <h3 class="fw-bold">Access Denied</h3>
  <a href="{{ url_for('auth.login') }}" class="btn btn-af-primary">Sign In</a>
</div>
{% endblock %}
