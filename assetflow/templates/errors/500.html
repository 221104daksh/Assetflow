{% extends "base.html" %}
{% block title %}Server Error{% endblock %}
{% block content %}
<div class="af-empty">
  <i class="bi bi-exclamation-triangle"></i>
  <h3 class="fw-bold">Something Went Wrong</h3>
  <p>An unexpected error occurred. Please try again.</p>
  <a href="{{ url_for('dashboard.index') }}" class="btn btn-af-primary">Back to Dashboard</a>
</div>
{% endblock %}
{% block guest_content %}
<div class="af-empty">
  <i class="bi bi-exclamation-triangle"></i>
  <h3 class="fw-bold">Something Went Wrong</h3>
  <a href="{{ url_for('auth.login') }}" class="btn btn-af-primary">Sign In</a>
</div>
{% endblock %}
