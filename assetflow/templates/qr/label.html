<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Label · {{ asset.asset_id }}</title>
  <style>
    @page { size: 90mm 50mm; margin: 0; }
    body { font-family: -apple-system, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 0; }
    .label { width: 90mm; height: 50mm; padding: 6mm; box-sizing: border-box; display: flex; align-items: center; gap: 5mm; border: 1px solid #ddd; }
    .label img.qr { width: 32mm; height: 32mm; }
    .label .info { flex: 1; }
    .label .org { font-size: 9px; color: #666; text-transform: uppercase; letter-spacing: .05em; margin-bottom: 2mm; }
    .label .asset-id { font-size: 16px; font-weight: 800; }
    .label .tag { font-size: 11px; color: #444; margin-top: 1mm; }
    .label .scan { font-size: 9px; color: #888; margin-top: 3mm; }
    .toolbar { padding: 16px; text-align: center; }
    @media print { .toolbar { display: none; } body { background: #fff; } }
  </style>
</head>
<body>
  <div class="toolbar">
    <button onclick="window.print()" style="padding:10px 18px;border-radius:8px;border:1px solid #ccc;background:#4361ee;color:#fff;font-weight:600;cursor:pointer;">Print Label</button>
  </div>

  <div class="label">
    <img class="qr" src="{{ qr_image }}" alt="QR">
    <div class="info">
      <div class="org">{{ org_name }}</div>
      <div class="asset-id">{{ asset.asset_id }}</div>
      <div class="tag">Tag: {{ asset.asset_tag }}</div>
      <div class="scan">{{ qr_label_title }}</div>
    </div>
  </div>
</body>
</html>
